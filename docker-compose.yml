services:
  app1:
    build: ./app
    image: cdn-benchmark-app:local
    environment:
      APP_NAME: app1
      PORT: "3000"
    restart: unless-stopped
    expose:
      - "3000"

  app2:
    image: cdn-benchmark-app:local
    environment:
      APP_NAME: app2
      PORT: "3000"
    restart: unless-stopped
    depends_on:
      app1:
        condition: service_started
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app1
      - app2
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
